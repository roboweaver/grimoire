server:
  addr: ":8080"
theme: default
database:
  vendor: mysql            # mysql | postgres | sqlite
  dsn: "user:pass@tcp(127.0.0.1:3306)/wordpress?parseTime=true&charset=utf8mb4"
  table_prefix: "wp_"
session:
  cookie_name: "grimoire_session"
  # Enable cookie_secure when serving over HTTPS/TLS.
  cookie_secure: false
  # Rolling session lifetime in hours (default 336 = 14 days).
  ttl_hours: 336

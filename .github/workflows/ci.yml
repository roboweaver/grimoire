name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (SQLite only)
        run: go test ./...

      # Isolation probe. Running the suite twice in one binary catches tests that
      # leak state into process-global state and only pass on a virgin process.
      # pkg/extensions did exactly that (#47): its registry is global and
      # append-only by design, so a second iteration saw the first iteration's
      # callbacks still in the chain. Nothing caught it because the plain
      # `go test ./...` gate above never runs a second iteration.
      #
      # This matters beyond the two tests that happened to collide: -count=N is
      # the standard way to probe for a real flake, and a package that reports a
      # false positive under it sends anyone doing that probe down a blind alley.
      # Cheap to keep honest -- the SQLite suite is a few seconds.
      - name: go test (isolation probe, -count=2)
        run: go test -count=2 ./...

  # Cross-vendor coverage. Kept as a separate job so a vendor-specific failure is
  # attributable at a glance, and so the fast SQLite job still reports quickly.
  #
  # This job exists because a MySQL-only defect shipped undetected: the greenfield
  # 0003 migration declared a prefix key longer than its column, which MySQL
  # rejects, and it failed the fixture build for the entire MySQL contract suite
  # (~60 subtests) across two milestones. See #37. The build-test job above runs
  # SQLite only, and the MySQL/Postgres contract runs are gated behind DSN
  # environment variables, so nothing here exercised them.
  #
  # MySQL matters most of the three: it is what real WordPress runs on, and so the
  # vendor grimoire is most likely to be pointed at.
  #
  # Postgres was held out of this job while its contract suite was failing (#40,
  # then #42) so the workflow would not land permanently red. Both are fixed, so
  # all three vendors now run here on every push -- which is the point: every
  # Postgres defect those two issues covered was reachable only by setting a DSN
  # locally, and so went unnoticed for several milestones.
  cross-vendor-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: grimoire_ci
          MYSQL_DATABASE: grimoire_test
        ports:
          - 3306:3306
        # Without a health check the job races the server's initialisation and
        # fails intermittently on connection refused rather than on a real defect.
        # This runs inside the mysql container, where mysqladmin is present.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pgrimoire_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: grimoire_ci
          POSTGRES_USER: grimoire
          POSTGRES_DB: grimoire_test
        ports:
          - 5432:5432
        # Same reasoning as the MySQL health check above; pg_isready ships in the
        # postgres image.
        options: >-
          --health-cmd="pg_isready -U grimoire -d grimoire_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=10s
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true
      # Belt and braces: GitHub already waits for the service health checks above
      # before running steps. This uses bash TCP probes rather than the vendors'
      # own clients so it does not depend on either being installed on the runner
      # image.
      - name: Wait for the database services to accept connections
        run: |
          wait_for() {
            name=$1 port=$2
            for i in $(seq 1 60); do
              if (exec 3<>/dev/tcp/127.0.0.1/"$port") 2>/dev/null; then
                echo "$name accepting connections after ${i}s"
                return 0
              fi
              sleep 1
            done
            echo "$name did not accept connections within 60s"
            return 1
          }
          wait_for MySQL 3306
          wait_for PostgreSQL 5432
      # Both DSNs are set for a single run so the contract suite exercises every
      # vendor in one pass: SQLite always, MySQL and Postgres because their DSN
      # variables are present.
      #
      # multiStatements is required for MySQL: the migration runner executes
      # multi-statement .sql files. parseTime is required for DATETIME columns to
      # scan into time.Time, the same reason the shipped MySQL config documents it.
      - name: go test (cross-vendor contract)
        env:
          GRIMOIRE_TEST_MYSQL_DSN: "root:grimoire_ci@tcp(127.0.0.1:3306)/grimoire_test?parseTime=true&multiStatements=true"
          GRIMOIRE_TEST_POSTGRES_DSN: "postgres://grimoire:grimoire_ci@127.0.0.1:5432/grimoire_test?sslmode=disable"
        run: go test ./internal/storage/storagetest/ -count=1 -v

  admin-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the admin SPA
        run: make admin

      - name: Verify committed dist matches source
        run: |
          if ! git diff --exit-code -- internal/admin/dist; then
            echo "internal/admin/dist is stale; run 'make admin' and commit the result."
            exit 1
          fi

  theme-css-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build theme CSS
        run: make theme-css

      - name: Verify committed theme CSS matches source
        run: |
          if ! git diff --exit-code -- themes/default/static/css; then
            echo "themes/default/static/css is stale; run 'make theme-css' and commit the result."
            exit 1
          fi

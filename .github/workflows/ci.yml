name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (SQLite only)
        run: go test ./...

  admin-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the admin SPA
        run: make admin

      - name: Verify committed dist matches source
        run: |
          if ! git diff --exit-code -- internal/admin/dist; then
            echo "internal/admin/dist is stale; run 'make admin' and commit the result."
            exit 1
          fi

  theme-css-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build theme CSS
        run: make theme-css

      - name: Verify committed theme CSS matches source
        run: |
          if ! git diff --exit-code -- themes/default/static/css; then
            echo "themes/default/static/css is stale; run 'make theme-css' and commit the result."
            exit 1
          fi
